[project]
name = "py-ast"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Daniel Alejandro Lasso Molina", email = "lassomoluna9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "lark>=1.1.9",
    "networkx>=3.2",
    "pydantic>=2.6.0",
    "pywebview>=5.0.0",
    "uvicorn[standard]>=0.28.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]
